name: ART FIELD NOTES V4 Fixed Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test date classification
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from v4_repair_fixed import period
          s,e,_=period('모집 기간: 2026.10.01 ~ 10.30')
          assert (s,e)==('2026-10-01','2026-10-30'), (s,e)
          print('Date parser test passed')
          PY
      - name: Refresh candidates
        run: python src/collector_v2.py
      - name: Verify and classify
        run: python src/v4_repair_fixed.py
      - name: Render preview
        run: python src/v4_mail.py
      - name: Check results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/verified_v4.json').read_text(encoding='utf-8'))
          assert sum(d['counts'].values()) == len(d['items'])
          assert Path('reports/art_field_v4_preview.html').is_file()
          print('V4 fixed:', d['counts'], 'excluded:', len(d['excluded']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: art-field-v4-fixed-results
          path: |
            data/verified_v4.json
            reports/art_field_v4_preview.html
            data/collection_status.json
          if-no-files-found: error
