name: ART FIELD NOTES V4 Safe Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify existing candidates
        run: python src/verify_v3.py
      - name: Filter stale and generic notices
        run: python src/v4_filter.py
      - name: Render V4 preview
        run: python src/v4_mail.py
      - name: Verify actual outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/verified_v4.json')
          h=Path('reports/art_field_v4_preview.html')
          assert p.is_file() and h.is_file()
          d=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(d['items'], list) and '<html' in h.read_text(encoding='utf-8')
          print('V4 audit counts:', d['counts'], 'excluded:', len(d['excluded']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: art-field-v4-safe-audit
          path: |
            data/verified_v4.json
            reports/art_field_v4_preview.html
          if-no-files-found: error
