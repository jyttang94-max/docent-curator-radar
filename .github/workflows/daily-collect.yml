name: Docent Curator Radar

on:
  schedule:
    # Korea 07:00 = UTC 22:00 (previous day)
    - cron: "0 22 * * *"
    # Korea 17:00 = UTC 08:00
    - cron: "0 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docent-curator-radar
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

      - name: Run collector
        id: collector
        continue-on-error: true
        run: |
          python -m src.collector

      - name: Upload collection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docent-radar-results
          path: |
            data/
            reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Save collection results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ reports/ || true

          if ! git diff --cached --quiet; then
            git commit -m "data: update docent radar results"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Check collector status
        if: steps.collector.outcome == 'failure'
        run: |
          echo "::error::Collector failed. Review logs."
          exit 1
